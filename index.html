<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>Doce Ateliê</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="logo">Doce Ateliê</div>
        <div class="nav">
            <button class="entrar">Entrar</button>
            <button class="cadastrar">Cadastrar</button>
        </div>
    </header>

    <main>
        <div class="conta">
            <form action="">
                <h3>Criar Cadastro</h3>
                <label for="nome">Nome Completo</label> <br>
                <input type="text" id="nome" autocomplete="name" required>
                <br>
                <label for="email">E-mail</label> <br>
                <input type="email" id="email" autocomplete="email" required>
                <br>
                <label for="tel">Telefone</label> <br>
                <input type="tel" id="tel" autocomplete="tel" required>
                <br>
                <label for="senha">Senha (mínimo 6 caracteres)</label> <br>
                <input type="password" id="senha" autocomplete="new-password" required>
                <br>
                <label for="confsenha">Confirmar Senha</label> <br>
                <input type="password" id="confsenha" autocomplete="new-password" required>
                <br>
                <button type="submit">Criar Cadastro</button>
            </form>
        </div>
    </main>

    <footer>Doce Ateliê · Comércio de doces e bolos</footer>

</body>

</html>
