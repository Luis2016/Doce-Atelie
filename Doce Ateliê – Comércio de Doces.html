<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doce Ateliê – Comércio de Doces</title>
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF5EE;--soft:#FDEBDC;--card:#fff;--ink:#4a2f22;--mut:#8a6a58;--or:#F5A855;--terra:#CD8F6E;--line:#EBCDB8;--ok:#5d8a4e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1d16;--soft:#38271e;--card:#43302a;--ink:#fbeadd;--mut:#d3b4a0;--line:#5f463a}}
:root[data-theme="dark"]{--bg:#2a1d16;--soft:#38271e;--card:#43302a;--ink:#fbeadd;--mut:#d3b4a0;--line:#5f463a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Nunito Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Gilda Display',Georgia,serif;font-weight:400;margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:.55rem 1rem;background:var(--terra);color:#fff;font-weight:700}
button.alt{background:transparent;color:var(--ink);border:1.5px solid var(--terra)}
button.or{background:var(--or);color:#4a2f22}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--or);outline-offset:2px}
input,select{font:inherit;padding:.5rem .7rem;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
.mode{display:flex;gap:.5rem;justify-content:center;align-items:center;padding:.5rem;background:var(--ink);color:var(--bg);font-size:.9rem}
.mode button{padding:.25rem .8rem;background:transparent;border:1.5px solid var(--or);color:var(--bg)}
.mode button.on{background:var(--or);color:#4a2f22}
header{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.2rem;padding:.9rem 1.2rem;background:var(--soft);border-bottom:1px solid var(--line)}
.logo{font-family:'Gilda Display',serif;font-size:1.6rem;margin-right:auto}
nav{display:flex;flex-wrap:wrap;gap:.3rem}
nav button{background:transparent;color:var(--ink);padding:.4rem .7rem}
nav button.on{background:var(--terra);color:#fff}
main{max-width:1050px;margin:0 auto;padding:1.2rem}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:1rem;align-items:center;background:var(--or);color:#4a2f22;border-radius:22px;padding:1.5rem 2rem;margin-bottom:1.5rem}
.hero h1{font-size:clamp(1.8rem,4vw,2.8rem);line-height:1.1}
.hero svg{width:100%;max-height:220px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card svg{display:block;width:100%;height:auto}
.card .b{padding:.8rem;display:flex;flex-direction:column;gap:.35rem;flex:1}
.price{font-weight:700;color:var(--terra);font-size:1.1rem}
.row{display:flex;gap:.5rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.fav{background:transparent;color:var(--terra);font-size:1.3rem;padding:0 .3rem;border:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem;margin-bottom:1rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
.tag{display:inline-block;padding:.1rem .6rem;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:.85rem}
.tag.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
label{display:block;font-size:.9rem;color:var(--mut);margin:.5rem 0 .2rem}
.item{display:flex;align-items:center;gap:.7rem;padding:.5rem 0;border-bottom:1px dashed var(--line)}
.item svg{width:64px;height:48px;border-radius:8px;flex:none}
.item .g{flex:1}
.wrap{overflow-x:auto}
p.mut{color:var(--mut);margin:.2rem 0}
.toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1.1rem;border-radius:99px;z-index:9}
@media(max-width:640px){.hero{grid-template-columns:1fr;padding:1.2rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="mode"><span>Visualizando como:</span><button id="mc" onclick="setM('c')">Cliente</button><button id="ma" onclick="setM('a')">ADM</button></div>
<header><div class="logo">Doce Ateliê</div><nav id="nav"></nav></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),R=n=>'R$ '+n.toFixed(2).replace('.',',');
const art=(t,a,b)=>{const bg=`<rect width="200" height="150" fill="${b}" opacity=".45"/><ellipse cx="100" cy="128" rx="78" ry="10" fill="#fff" opacity=".8"/>`;let s='';
if(t=='bolo')s=`<rect x="50" y="78" width="100" height="44" rx="8" fill="${b}"/><rect x="62" y="48" width="76" height="36" rx="8" fill="${a}"/><path d="M62 56h76v8c-6 10-10-2-16 6s-10-4-18 4-10-6-18 2-10-8-24 0z" fill="#fff" opacity=".85"/><circle cx="100" cy="42" r="7" fill="#c0392b"/><rect x="99" y="30" width="2" height="10" fill="#6b8e4e"/>`;
else if(t=='cupcake')s=`<path d="M64 84h72l-10 40H74z" fill="${b}" stroke="${a}" stroke-width="2"/><circle cx="100" cy="72" r="30" fill="${a}"/><circle cx="100" cy="50" r="20" fill="${a}"/><circle cx="100" cy="34" r="11" fill="${a}"/><circle cx="100" cy="22" r="6" fill="#c0392b"/><path d="M80 66q20 10 40 0M86 48q14 8 28 0" stroke="#fff" stroke-width="3" fill="none" opacity=".6"/>`;
else if(t=='brigadeiro')s=[[62,100],[100,100],[138,100],[81,70],[119,70],[100,42]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="18" fill="${a}"/><g fill="${b}"><rect x="${x-9}" y="${y-8}" width="5" height="2" rx="1" transform="rotate(30 ${x} ${y})"/><rect x="${x+2}" y="${y-10}" width="5" height="2" rx="1" transform="rotate(-40 ${x} ${y})"/><rect x="${x-6}" y="${y+3}" width="5" height="2" rx="1" transform="rotate(-20 ${x} ${y})"/><rect x="${x+3}" y="${y+4}" width="5" height="2" rx="1" transform="rotate(60 ${x} ${y})"/></g>`).join('');
else s=`<path d="M40 112L100 40l60 72z" fill="${b}"/><path d="M40 112L100 40l60 72z" fill="none" stroke="${a}" stroke-width="5" stroke-linejoin="round"/><path d="M58 98h84" stroke="${a}" stroke-width="4"/><circle cx="82" cy="84" r="7" fill="#c0392b"/><circle cx="104" cy="78" r="7" fill="#c0392b"/><circle cx="122" cy="92" r="7" fill="#c0392b"/><circle cx="96" cy="64" r="6" fill="#c0392b"/>`;
return `<svg viewBox="0 0 200 150" role="img" aria-label="${t}" xmlns="http://www.w3.org/2000/svg">${bg}${s}</svg>`};
let P=[{id:1,n:'Bolo de cenoura com chocolate',p:48,t:'bolo',a:'#8a4b2d',b:'#F5A855',d:'Massa fofinha e cobertura cremosa.'},
{id:2,n:'Cupcake de morango',p:9.5,t:'cupcake',a:'#f4a0b0',b:'#CD8F6E',d:'Chantilly de morango fresco.'},
{id:3,n:'Caixa de brigadeiros (12)',p:36,t:'brigadeiro',a:'#5a3325',b:'#fde9d6',d:'Brigadeiro tradicional com granulado.'},
{id:4,n:'Torta de frutas vermelhas',p:62,t:'torta',a:'#CD8F6E',b:'#fde0b8',d:'Massa crocante, creme e frutas.'},
{id:5,n:'Bolo de ninho com morango',p:75,t:'bolo',a:'#fff3e0',b:'#f4a0b0',d:'Recheio de leite ninho.'},
{id:6,n:'Cupcake de chocolate',p:9,t:'cupcake',a:'#6b3a28',b:'#F5A855',d:'Ganache de chocolate meio amargo.'}];
let cart={},favs=new Set(),orders=[],coupons=[{code:'DOCE10',pct:10}],reviews=[{c:'Marina',s:5,t:'O bolo de cenoura é perfeito!'},{c:'Paulo',s:4,t:'Entrega rápida e caprichada.'}],
user=null,mode='c',view='shop',cp=null,pay='Pix',nid=7,oid=101,shop={name:'Doce Ateliê',tel:'(35) 99999-0000',addr:'Rua das Flores, 123'};
const NAV={c:[['shop','Comprar'],['favs','Favoritos'],['orders','Pedidos'],['about','Sobre'],['faq','FAQs'],['acc','Conta'],['cart','Carrinho']],
a:[['prod','Produtos'],['ord','Pedidos'],['cup','Cupons'],['rev','Avaliações'],['sobre','Sobre'],['sup','FAQs'],['acc','Conta']]};
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function setM(m){mode=m;view=m=='c'?'shop':'prod';draw()}
function go(v){view=v;draw();scrollTo(0,0)}
const cnt=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const sub=()=>Object.entries(cart).reduce((s,[i,q])=>s+P.find(x=>x.id==i).p*q,0);
function add(i){cart[i]=(cart[i]||0)+1;draw();toast('Adicionado ao carrinho')}
function fav(i){favs.has(i)?favs.delete(i):favs.add(i);draw()}
function qty(i,d){cart[i]+=d;if(cart[i]<1)delete cart[i];draw()}
function applyC(){const c=coupons.find(x=>x.code==$('#cp').value.trim().toUpperCase());cp=c||null;toast(c?'Cupom aplicado':'Cupom inválido');draw()}
function setPay(v){pay=v;draw()}
function finish(){if(!user){toast('Entre na sua conta para finalizar');go('acc');return}
const t=sub()*(1-(cp?cp.pct:0)/100);orders.unshift({id:oid++,u:user,it:Object.entries(cart).map(([i,q])=>q+'× '+P.find(x=>x.id==i).n).join(', '),t,pay,ok:false,st:'Aguardando pagamento'});cart={};cp=null;toast('Pedido realizado!');go('orders')}
function login(reg){const n=$('#nm')?$('#nm').value.trim():'';const m=$('#em').value.trim();if(!m){toast('Preencha o e-mail');return}user=n||m.split('@')[0];draw();toast('Bem-vindo(a), '+user)}
function logout(){user=null;draw()}
function card(p,ad){return `<div class="card">${art(p.t,p.a,p.b)}<div class="b"><div class="row"><h3>${p.n}</h3>${ad?'':`<button class="fav" aria-label="Favoritar" onclick="fav(${p.id})">${favs.has(p.id)?'♥':'♡'}</button>`}</div><p class="mut">${p.d}</p><div class="row" style="margin-top:auto"><span class="price">${R(p.p)}</span>${ad?`<span><button class="alt" onclick="editP(${p.id})">Preço</button> <button class="alt" onclick="delP(${p.id})">Excluir</button></span>`:`<button onclick="add(${p.id})">Adicionar</button>`}</div></div></div>`}
function editP(i){const p=P.find(x=>x.id==i),v=parseFloat((prompt('Novo preço (R$):',p.p)||'').replace(',','.'));if(v>0){p.p=v;draw();toast('Produto atualizado')}}
function delP(i){P=P.filter(x=>x.id!=i);draw();toast('Produto removido')}
function pub(){const n=$('#pn').value.trim(),p=parseFloat($('#pp').value.replace(',','.'));if(!n||!(p>0)){toast('Informe nome e preço');return}
const cs={'Chocolate':['#6b3a28','#F5A855'],'Morango':['#f4a0b0','#CD8F6E'],'Baunilha':['#fff3e0','#F5A855'],'Cenoura':['#8a4b2d','#F5A855']}[$('#pc').value];
P.push({id:nid++,n,p,t:$('#pt').value,a:cs[0],b:cs[1],d:$('#pd').value.trim()||'Feito com carinho.'});draw();toast('Produto publicado')}
function setSt(i,v){orders.find(o=>o.id==i).st=v;draw()}
function okPay(i){const o=orders.find(x=>x.id==i);o.ok=true;o.st='Em preparo';draw();toast('Pagamento confirmado')}
function addCup(){const c=$('#cc').value.trim().toUpperCase(),p=parseInt($('#cpc').value);if(!c||!(p>0&&p<=100)){toast('Informe código e % válido');return}coupons.push({code:c,pct:p});draw()}
function saveShop(){shop={name:$('#sn').value,tel:$('#st').value,addr:$('#sa').value};toast('Perfil salvo')}
const V={
shop:()=>`<section class="hero"><div><h1>Doces e bolos feitos à mão</h1><p>Escolha, adicione ao carrinho e receba em casa.</p><button class="alt" style="border-color:#4a2f22;color:#4a2f22" onclick="document.getElementById('lista').scrollIntoView({behavior:'smooth'})">Ver produtos</button></div>${art('bolo','#8a4b2d','#fff3e0')}</section><h2 id="lista" style="margin-bottom:.8rem">Nossos produtos</h2><div class="grid">${P.map(p=>card(p)).join('')}</div>`,
favs:()=>`<h2 style="margin-bottom:.8rem">Favoritos</h2>${favs.size?`<div class="grid">${P.filter(p=>favs.has(p.id)).map(p=>card(p)).join('')}</div>`:'<p class="mut">Toque no ♡ de um produto para salvar aqui.</p>'}`,
cart:()=>{const ids=Object.keys(cart);if(!ids.length)return '<h2>Carrinho</h2><p class="mut">Seu carrinho está vazio.</p><button onclick="go(\'shop\')">Ver produtos</button>';const d=cp?sub()*cp.pct/100:0;
return `<h2 style="margin-bottom:.8rem">Resumo do pedido</h2><div class="cols"><div class="box">${ids.map(i=>{const p=P.find(x=>x.id==i);return `<div class="item">${art(p.t,p.a,p.b)}<div class="g"><b>${p.n}</b><br><span class="mut">${R(p.p)}</span></div><button class="alt" onclick="qty(${i},-1)" aria-label="Menos">−</button><b>${cart[i]}</b><button class="alt" onclick="qty(${i},1)" aria-label="Mais">+</button></div>`}).join('')}</div>
<div class="box"><label for="cp">Cupom</label><div class="row"><input id="cp" placeholder="Ex.: DOCE10" style="flex:1"><button class="or" onclick="applyC()">Aplicar</button></div>
<label for="pg">Método de pagamento</label><select id="pg" onchange="setPay(this.value)">${['Pix','Cartão de crédito','Dinheiro na entrega'].map(x=>`<option${x==pay?' selected':''}>${x}</option>`).join('')}</select>
<p class="mut" style="margin-top:.8rem">Subtotal: ${R(sub())}</p>${cp?`<p class="mut">Cupom ${cp.code}: −${R(d)}</p>`:''}<p class="mut">Envio: a combinar após o pedido</p><h3 style="margin:.4rem 0 .8rem">Total: ${R(sub()-d)}</h3><button style="width:100%" onclick="finish()">Finalizar pedido</button></div></div>`},
orders:()=>{const o=orders.filter(x=>x.u==user);return `<h2 style="margin-bottom:.8rem">Status do pedido</h2>${!user?'<p class="mut">Entre na sua conta para ver seus pedidos.</p>':o.length?o.map(x=>`<div class="box"><div class="row"><b>Pedido #${x.id}</b><span class="tag ${x.st=='Entregue'?'ok':''}">${x.st}</span></div><p class="mut">${x.it}</p><p>${R(x.t)} · ${x.pay}</p></div>`).join(''):'<p class="mut">Você ainda não fez pedidos.</p>'}`},
about:()=>`<h2>Sobre a loja</h2><div class="box"><h3>${shop.name}</h3><p>Doces e bolos artesanais, feitos sob encomenda com ingredientes selecionados.</p><p class="mut">${shop.addr}<br>Contato: ${shop.tel}</p></div>`,
faq:()=>`<h2 style="margin-bottom:.8rem">Perguntas frequentes</h2>${[['Como faço um pedido?','Adicione os produtos ao carrinho, escolha o pagamento e finalize.'],['Como acompanho meu pedido?','Em Pedidos você vê o status em tempo real.'],['Quais são os termos e condições?','Encomendas são confirmadas após a verificação do pagamento.'],['Preciso de suporte','Fale com a loja pelo contato na página Sobre.']].map(([q,a])=>`<details class="box"><summary><b>${q}</b></summary><p class="mut">${a}</p></details>`).join('')}`,
acc:()=>user?`<h2>Minha conta</h2><div class="box"><p>Olá, <b>${user}</b> (${mode=='c'?'Cliente':'ADM'}).</p><button class="alt" onclick="logout()">Sair</button></div>`:`<h2 style="margin-bottom:.8rem">Conta</h2><div class="cols"><div class="box"><h3>Entrar</h3><label for="em">E-mail</label><input id="em" type="email"><label for="pw">Senha</label><input id="pw" type="password"><br><br><button onclick="login()">Entrar</button></div><div class="box"><h3>Criar cadastro</h3><label for="nm">Nome</label><input id="nm"><label for="em2">E-mail (use o mesmo acima)</label><input id="em2" disabled placeholder="preencha o campo e-mail ao lado"><br><br><button class="or" onclick="login(1)">Cadastrar</button></div></div>`,
prod:()=>`<h2 style="margin-bottom:.8rem">Publicar produto</h2><div class="box"><div class="cols"><div><label for="pn">Nome</label><input id="pn"><label for="pd">Descrição</label><input id="pd"></div><div><label for="pp">Preço (R$)</label><input id="pp" inputmode="decimal"><label for="pt">Tipo</label><select id="pt"><option value="bolo">Bolo</option><option value="cupcake">Cupcake</option><option value="brigadeiro">Brigadeiro</option><option value="torta">Torta</option></select><label for="pc">Sabor / cor</label><select id="pc"><option>Chocolate</option><option>Morango</option><option>Baunilha</option><option>Cenoura</option></select></div></div><br><button onclick="pub()">Publicar produto</button></div><h2 style="margin-bottom:.8rem">Produtos na loja</h2><div class="grid">${P.map(p=>card(p,1)).join('')}</div>`,
ord:()=>`<h2 style="margin-bottom:.8rem">Pedidos</h2>${orders.length?orders.map(x=>`<div class="box"><div class="row"><b>#${x.id} · ${x.u}</b><span class="tag ${x.ok?'ok':''}">${x.ok?'Pagamento confirmado':'Pagamento pendente'}</span></div><p class="mut">${x.it}</p><p>${R(x.t)} · ${x.pay}</p><div class="row">${x.ok?`<select onchange="setSt(${x.id},this.value)" aria-label="Status">${['Em preparo','Enviado','Entregue'].map(s=>`<option${s==x.st?' selected':''}>${s}</option>`).join('')}</select>`:`<button class="or" onclick="okPay(${x.id})">Verificar pagamento</button>`}</div></div>`).join(''):'<p class="mut">Nenhum pedido ainda. Faça um pedido na visão Cliente para testar.</p>'}`,
cup:()=>`<h2 style="margin-bottom:.8rem">Cupons da loja</h2><div class="box"><div class="cols"><div><label for="cc">Código</label><input id="cc"></div><div><label for="cpc">Desconto (%)</label><input id="cpc" inputmode="numeric"></div></div><br><button onclick="addCup()">Criar cupom</button></div>${coupons.map(c=>`<span class="tag">${c.code} · ${c.pct}%</span> `).join('')}`,
rev:()=>`<h2 style="margin-bottom:.8rem">Avaliações dos clientes</h2>${reviews.map(r=>`<div class="box"><b>${r.c}</b> <span class="price">${'★'.repeat(r.s)}${'☆'.repeat(5-r.s)}</span><p class="mut">${r.t}</p></div>`).join('')}<h3 style="margin:1rem 0 .5rem">Informações do cliente</h3>${[...new Set(orders.map(o=>o.u))].map(u=>`<span class="tag">${u}</span> `).join('')||'<p class="mut">Os clientes aparecem aqui após o primeiro pedido.</p>'}`,
sobre:()=>`<h2 style="margin-bottom:.8rem">Perfil da loja</h2><div class="box"><label for="sn">Nome da loja</label><input id="sn" value="${shop.name}"><label for="st">Telefone</label><input id="st" value="${shop.tel}"><label for="sa">Endereço</label><input id="sa" value="${shop.addr}"><br><br><button onclick="saveShop()">Salvar perfil</button></div>`,
sup:()=>`<h2>Suporte</h2><div class="box"><p>Dúvidas sobre a plataforma? Fale com o suporte técnico.</p><p class="mut">suporte@doceatelie.com</p></div>`};
function draw(){$('#mc').className=mode=='c'?'on':'';$('#ma').className=mode=='a'?'on':'';
$('#nav').innerHTML=NAV[mode].map(([k,l])=>`<button class="${view==k?'on':''}" onclick="go('${k}')">${l}${k=='cart'&&cnt()?' ('+cnt()+')':''}</button>`).join('');
$('#app').innerHTML=V[view]()}
draw();
</script>
</body>
</html>
